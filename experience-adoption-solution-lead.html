<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scaleup CEO Trainee</title>

    <!-- Samma CSS som på startsidan -->
    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body>
    <!-- Samma silk-bakgrund -->
    <canvas id="silk-bg" aria-hidden="true"></canvas>

    <div class="layout">
      <!-- Vänsterspalt: kan vara identisk med startsidan om du vill.
           För nu: tom för att hålla sidan enkel. -->
      <aside class="sidebar">
        <div class="sidebarInner">
          <a class="btn btnGhost" href="./index.html">Tillbaka</a>

          <div style="height: 14px"></div>

          <div class="pill">Experience</div>
          <h1 class="name" style="font-size: 22px; margin-top: 10px;">Adoption Solution Lead</h1>
          <p class="bio">Detaljsida</p>
        </div>
      </aside>

      <!-- Högerspalt -->
      <main class="content">
        <!-- Box 1: Roll -->
        <section class="card">
          <h2 style="margin: 0;">Adoption Solution Lead</h2>
        </section>
        <section class="card">
  <div class="statsGrid">
    <div class="stat">
      <div class="statLabel">ARR organic</div>
      <div class="statValue">
        <span class="countup" data-to="50" data-from="0" data-duration="2"></span>
        <span class="statSuffix">M SEK</span>
      </div>
    </div>

    <div class="stat">
      <div class="statLabel">Average eNPS</div>
      <div class="statValue">
        <span class="countup" data-to="90" data-from="0" data-duration="2"></span>
      </div>
    </div>

    <div class="stat">
      <div class="statLabel">Employees</div>
      <div class="statValue">
        <span class="countup" data-to="35" data-from="0" data-duration="2"></span>
      </div>
    </div>
  </div>
</section>

        <!-- Box 2: Introtext -->
<section class="card">
  <h3 style="margin-top: 0;">
    Going from Trainee to the first founding Adoption Manager at CatalystOne Engage
  </h3>

  <p>
    Lorum impsum lol
  </p>

</section>
      </main>
    </div>

    <!-- Samma bakgrunds-script -->
    <script type="module" src="./silk-bg.js"></script>
    <script type="module" src="./countup.js"></script>
  </body>
</html>
